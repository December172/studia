name: Publish image
# main publishes latest; the fork's integration branch publishes dev. Both keep full commit SHA tags.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase image repository
        id: image
        shell: bash
        run: printf 'name=%s\n' "ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
